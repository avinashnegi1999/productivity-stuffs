<svg xmlns="http://www.w3.org/2000/svg" width="750" height="328" viewBox="0 0 750 328" role="img">
  <title>Phase 1 progress</title>
  <!-- Blue bar width = 3 x percent (300 = 100%). -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif; fill: #1d1d1f; }
    .eyebrow { font-size: 14px; fill: #333333; letter-spacing: -0.2px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, system-ui, sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }
    .label { font-size: 15px; letter-spacing: -0.2px; }
    .pct { font-size: 14px; fill: #333333; }
  </style>
  <rect width="750" height="328" rx="18" fill="#f5f5f7"/>
  <text x="32" y="42" class="eyebrow">Phase 1 · Months 1–12</text>
  <text x="32" y="70" class="title">Foundations</text>

  <text x="32" y="116" class="label">Build in public</text>
  <rect x="360" y="108" width="300" height="6" rx="3" fill="#e0e0e0"/>
  <text x="718" y="116" class="pct" text-anchor="end">0%</text>

  <text x="32" y="152" class="label">Linux</text>
  <rect x="360" y="144" width="300" height="6" rx="3" fill="#e0e0e0"/>
  <text x="718" y="152" class="pct" text-anchor="end">0%</text>

  <text x="32" y="188" class="label">Python</text>
  <rect x="360" y="180" width="300" height="6" rx="3" fill="#e0e0e0"/>
  <rect x="360" y="180" width="90" height="6" rx="3" fill="#0066cc"/>
  <text x="718" y="188" class="pct" text-anchor="end">30%</text>

  <text x="32" y="224" class="label">Web basics</text>
  <rect x="360" y="216" width="300" height="6" rx="3" fill="#e0e0e0"/>
  <text x="718" y="224" class="pct" text-anchor="end">0%</text>

  <text x="32" y="260" class="label">React and Next.js</text>
  <rect x="360" y="252" width="300" height="6" rx="3" fill="#e0e0e0"/>
  <text x="718" y="260" class="pct" text-anchor="end">0%</text>

  <text x="32" y="296" class="label">Backend and databases</text>
  <rect x="360" y="288" width="300" height="6" rx="3" fill="#e0e0e0"/>
  <text x="718" y="296" class="pct" text-anchor="end">0%</text>
</svg>
